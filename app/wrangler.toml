name = "watchforme"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".vercel/output/static"
binding = "ASSETS"

# Non-secret public vars — secrets go in Cloudflare dashboard under
# Workers > Settings > Environment Variables
[vars]
NEXT_PUBLIC_APP_URL = "https://watchforme.me"
NEXT_PUBLIC_GA_ID = "G-E88RPKCB1S"
EMAIL_FROM = "alerts@watchforme.me"
